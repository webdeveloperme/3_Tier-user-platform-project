  client-test:
    runs-on: ubuntu-latest
    needs: client-lint
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm test --prefix client || true
      - uses: actions/upload-artifact@v4
        with:
          name: client-test-report
          path: client/test-results
          if-no-files-found: warn

  server-test:
    runs-on: ubuntu-latest
    needs: server-lint
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm test --prefix server || true
      - uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/test-results
          if-no-files-found: warn
