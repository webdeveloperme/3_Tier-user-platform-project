name: Enterprise DevSecOps CICD Pipeline

on:
  push:
    branches:
      - QA
    paths:
      - client/**
      - server/**
      - .github/workflows/Qa-cicd.yml

jobs:
  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Dockerfile scan
        run: |
          checkov -d . \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json || true
      - name: Upload Checkov Dockerfile report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn

  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Terraform scan
        run: |
          checkov -d . \
            --framework terraform \
            --output json > checkov-terraform-report.json || true
      - name: Upload Checkov Terraform report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn

  checkov-k8s:
    name: Checkov Kubernetes Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Kubernetes scan
        run: |
          checkov -d . \
            --framework kubernetes \
            --output json > checkov-k8s-report.json || true
      - name: Upload Checkov Kubernetes report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json
          if-no-files-found: warn

  trivy-client:
    name: Trivy Client Scan (Frontend)
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Run Trivy scan on client
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/client:/client" \
            aquasec/trivy:latest fs /client \
            --format json \
            --output /client/trivy-client-report.json || true
      - name: Upload Trivy Client report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-client-report
          path: client/trivy-client-report.json
          if-no-files-found: warn

  trivy-server:
    name: Trivy Server Scan (Backend)
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Run Trivy scan on server
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/server:/server" \
            aquasec/trivy:latest fs /server \
            --format json \
            --output /server/trivy-server-report.json || true
      - name: Upload Trivy Server report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-server-report
          path: server/trivy-server-report.json
          if-no-files-found: warn

  summary:
    name: Collect All Reports
    runs-on: ubuntu-latest
    needs: [checkov-dockerfile, checkov-terraform, checkov-k8s, trivy-client, trivy-server]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Generate Markdown summary table
        run: |
          mkdir -p combined
          echo "| Tool               | Report File                    | Artifact Name             |" > combined/summary.md
          echo "|--------------------|--------------------------------|---------------------------|" >> combined/summary.md
          echo "| Gitleaks           | gitleaks-report.json           | gitleaks-report           |" >> combined/summary.md
          echo "| Checkov Dockerfile | checkov-dockerfile-report.json | checkov-dockerfile-report |" >> combined/summary.md
          echo "| Checkov Terraform  | checkov-terraform-report.json  | checkov-terraform-report  |" >> combined/summary.md
          echo "| Checkov Kubernetes | checkov-k8s-report.json        | checkov-k8s-report        |" >> combined/summary.md
          echo "| Trivy Client       | trivy-client-report.json       | trivy-client-report       |" >> combined/summary.md
          echo "| Trivy Server       | trivy-server-report.json       | trivy-server-report       |" >> combined/summary.md

      - name: Upload combined reports
        uses: actions/upload-artifact@v4
        with:
          name: all-security-reports
          path: combined
          if-no-files-found: warn

      - name: Add summary to GitHub Actions UI
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          cat combined/summary.md >> $GITHUB_STEP_SUMMARY
