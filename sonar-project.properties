# Project identification
sonar.projectKey=3_Tier-user-platform-project
sonar.projectName=3 Tier User Platform Project
sonar.projectVersion=1.0

# Source code location
sonar.sources=client,server

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Language settings (optional if auto-detected)
sonar.language=js

# Test reports (if you want SonarQube to include test results)
sonar.tests=client/test,server/test
sonar.test.inclusions=**/*.test.js

# Coverage reports (if you use Jest or other tools)
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info
